<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<body>
	<section layout:fragment="content">
	
	    <div class="container my-4">
	
	        <div class="d-flex justify-content-between align-items-center mb-3">
	            <h2>
	                <i class="bi bi-graph-up-arrow me-2"></i>
	                Révision du loyer
	            </h2>
	
	            <a th:href="@{/bails}" class="btn btn-outline-secondary">
	                <i class="bi bi-arrow-left me-1"></i>Retour
	            </a>
	        </div>
	
	        <div class="card shadow-sm">
	            <div class="card-header bg-success text-white">
	                Informations du bail
	            </div>
	
	            <div class="card-body">
	
	                <div class="row mb-3">
	                    <div class="col-md-6">
	                        <label class="form-label fw-bold">Locataire</label>
	                        <input type="text"
	                               class="form-control"
	                               th:value="${bail.locataire != null
	                                   ? bail.locataire.nom : ''}"
	                               readonly>
	                    </div>
	
	                    <div class="col-md-6">
	                        <label class="form-label fw-bold">Appartement</label>
	                        <input type="text"
	                               class="form-control"
	                               th:value="${bail.appartement != null
	                                   ? bail.appartement.libelle : ''}"
	                               readonly>
	                    </div>
	                </div>
	
	                <form th:action="@{/bails/{id}/revision-loyer(id=${bail.id})}"
	                      method="post">
	
	                    <input type="hidden"
	                           th:name="${_csrf.parameterName}"
	                           th:value="${_csrf.token}"
	                           th:if="${_csrf != null}">
	
	                    <div class="row mb-3">
	
	                        <div class="col-md-6">
	                            <label class="form-label fw-bold">
	                                Loyer actuel (FCFA)
	                            </label>
	
	                            <input type="text"
	                                   class="form-control"
	                                   th:value="${#numbers.formatDecimal(
	                                       bail.montantLoyer, 0, 'POINT', 0, 'POINT')}"
	                                   readonly>						   
									   
	                        </div>
	
	                        <div class="col-md-6">
	                            <label for="nouveauMontantLoyer"
	                                   class="form-label fw-bold">
	                                Nouveau loyer (FCFA)
	                            </label>
	
	                            <input type="number"
	                                   class="form-control"
	                                   id="nouveauMontantLoyer"
	                                   name="nouveauMontantLoyer"
	                                   th:value="${nouveauMontantLoyer}"
	                                   min="1"
	                                   step="1"
	                                   required>
	                        </div>
	
	                    </div>
	
	                    <div class="mb-3">
	                        <label for="dateEffetLoyer"
	                               class="form-label fw-bold">
	                            Date d'effet
	                        </label>
	
	                        <input type="date"
	                               class="form-control"
	                               id="dateEffetLoyer"
	                               name="dateEffetLoyer"
	                               th:value="${dateEffetLoyer}"
	                               th:min="${bail.dateDebut}"
	                               required>
	                    </div>
	
	                    <div class="alert alert-info">
	                        <i class="bi bi-info-circle me-2"></i>
	                        Vérifiez le nouveau montant et la date d'effet
	                        avant de confirmer la révision.
	                    </div>
	
	                    <div class="d-flex justify-content-end gap-2">
	                        <a th:href="@{/bails}"
	                           class="btn btn-secondary">
	                            Annuler
	                        </a>
	
	                        <button type="submit" class="btn btn-success">
	                            <i class="bi bi-check-circle me-1"></i>
	                            Enregistrer la révision
	                        </button>
	                    </div>
	
	                </form>
	
	            </div>
	        </div>
	
	    </div>
		
		<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	
		<!-- Select2 4.1 -->
		<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
		<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
	
		<!-- Theme Bootstrap 5 -->
		<link href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css" rel="stylesheet" />
	
		<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	
		<div th:if="${successMessage}" th:text="${successMessage}" id="successMessage" style="display:none;"></div>
	
		<!-- Boîte de confirmation avant envoi + message de succès -->
		<script>
		    document.getElementById('encaisseForm').addEventListener('submit', function (e) {
		        e.preventDefault(); // Bloque l'envoi automatique
		        const form = this;
	
				const idField = form.querySelector('input[name="id"]');
				const idValue = idField ? idField.value.trim() : "";
		        const isEdit = idValue !== "" && idValue !== "0";
	
		        Swal.fire({
		            title: 'Confirmation',
		            text: isEdit ? 'Voulez-vous modifier ?' : 'Voulez-vous enregistrer ?',
		            icon: 'question',
		            showCancelButton: true,
		            cancelButtonText: 'Non',
					confirmButtonText: 'Oui',
		            reverseButtons: true
		        }).then((result) => {
		            if (result.isConfirmed) {
		                form.submit(); // Si confirmé → on envoie le formulaire
		            }
		        });
			});
	
			// ==== AFFICHAGE DU MESSAGE SUCCÈS APRÈS ACTION ====
			document.addEventListener('DOMContentLoaded', function () {
			    const successDiv = document.getElementById('successMessage');
			    if (successDiv && successDiv.textContent.trim() !== '') {
			        Swal.fire({
			            icon: 'success',
			            title: 'Succès !',
			            text: successDiv.textContent.trim(),
			            confirmButtonText: 'OK'
			        });
			    }
			});
		</script>
	
	
	</section>
</body>
</html>
