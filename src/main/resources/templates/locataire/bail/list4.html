<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<body>
<section layout:fragment="content">

    <div class="container my-2">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Gestion des baux</h2>
            <a th:href="@{/bails/create}" class="btn btn-primary">
                <i class="bi bi-plus-circle me-1"></i>Nouveau
            </a>
        </div>

        <hr style="border: 1px solid rgb(192, 192, 192);">

        <fieldset style="border: 1px solid #ccc; padding: 10px; border-radius: 10px;">

            <h5>Liste des baux</h5>

            <div class="row mb-3">
                <div class="col-md-4">
                    <input type="text"
                           id="searchInput"
                           class="form-control"
                           placeholder="Rechercher un locataire"
                           autocomplete="off">
                </div>
            </div>

            <div id="loader" class="text-center my-3 d-none">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Chargement...</span>
                </div>
                <div>Recherche en cours...</div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-success">
                    <tr>
                        <th>Locataire</th>
                        <th>Appartement</th>
						<th>Loyer</th>
                        <th>Montant payé</th>
                        <th>Statut</th>
                        <th class="text-center">Actions</th>
                    </tr>
                    </thead>

                    <tbody id="bailTableBody">

                    <tr th:each="bail : ${bailsPage.content}"
                        th:classappend="${bail.statut == T(com.app.enums.StatutBail).RESILIE}
                        ? 'table-secondary text-muted' : ''">

                        <td th:text="${bail.locataireNom}"></td>

                        <td th:text="|${bail.appartementLibelle} ${bail.immeubleLibelle} ${bail.bailleurPrenom}|"></td>
						
						<td class="format-fr" th:text="${bail.montantLoyer}"></td>						

                        <td class="format-fr" th:text="${bail.total}"></td>

                        <td>
                            <span th:if="${bail.statut == T(com.app.enums.StatutBail).ACTIF}"
                                  class="badge bg-success">Actif</span>

                            <span th:if="${bail.statut == T(com.app.enums.StatutBail).RESILIE}"
                                  class="badge bg-danger">Résilié</span>
                        </td>

                        <td class="text-center">

                            <div class="dropdown"
                                 th:if="${bail.statut == T(com.app.enums.StatutBail).ACTIF}">

                                <button class="btn btn-light btn-sm"
                                        type="button"
                                        data-bs-toggle="dropdown"
                                        aria-expanded="false"
                                        title="Actions">
                                    <i class="bi bi-three-dots-vertical"></i>
                                </button>

                                <ul class="dropdown-menu dropdown-menu-end">

                                    <li>
                                        <a class="dropdown-item"
                                           th:href="@{/bails/edit/{id}(id=${bail.id})}">
                                            <i class="bi bi-pencil me-2"></i>Modifier
                                        </a>
                                    </li>

                                    <li>
                                        <a class="dropdown-item"
                                           th:href="@{/bails/{id}/revision-loyer(id=${bail.id})}">
                                            <i class="bi bi-graph-up-arrow me-2"></i>
                                            Réviser le loyer
                                        </a>
                                    </li>
									
									<li th:if="${bail.statut.name() != 'RESILIE'}">
									    <a class="dropdown-item"
									       th:href="@{/baux/{id}/contrat(id=${bail.id})}"
									       target="_blank">
									        <i class="bi bi-file-earmark-pdf me-2"></i>Contrat de bail
									    </a>
									</li>
									
                                    <li>
                                        <a class="dropdown-item text-warning resilier-btn"
                                           th:href="@{/bails/resilier/{id}(id=${bail.id})}">
                                            <i class="bi bi-x-circle me-2"></i>Résilier
                                        </a>
                                    </li>

                                </ul>
                            </div>

                            <span th:if="${bail.statut == T(com.app.enums.StatutBail).RESILIE}"
                                  class="text-muted">Aucune action</span>

                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(bailsPage.content)}">
                        <td colspan="5" class="text-center">
                            Aucun bail trouvé.
                        </td>
                    </tr>

                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div class="d-flex justify-content-center mt-3"
                 th:if="${bailsPage.totalElements > 0}">

                <ul class="pagination" id="paginationContainer">

                    <li class="page-item"
                        th:classappend="${bailsPage.first} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/bails(page=${bailsPage.number - 1})}">
                            &laquo;
                        </a>
                    </li>

                    <li class="page-item"
                        th:if="${bailsPage.number > 2}">
                        <a class="page-link" th:href="@{/bails(page=0)}">1</a>
                    </li>

                    <li class="page-item disabled"
                        th:if="${bailsPage.number > 3}">
                        <span class="page-link">...</span>
                    </li>

                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(
                            T(java.lang.Math).max(0, bailsPage.number - 2),
                            T(java.lang.Math).min(bailsPage.totalPages - 1, bailsPage.number + 2)
                        )}"
                        th:classappend="${i == bailsPage.number} ? 'active'">

                        <a class="page-link"
                           th:text="${i + 1}"
                           th:href="@{/bails(page=${i})}">
                        </a>
                    </li>

                    <li class="page-item disabled"
                        th:if="${bailsPage.number < bailsPage.totalPages - 4}">
                        <span class="page-link">...</span>
                    </li>

                    <li class="page-item"
                        th:if="${bailsPage.number < bailsPage.totalPages - 3}">
                        <a class="page-link"
                           th:href="@{/bails(page=${bailsPage.totalPages - 1})}"
                           th:text="${bailsPage.totalPages}">
                        </a>
                    </li>

                    <li class="page-item"
                        th:classappend="${bailsPage.last} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/bails(page=${bailsPage.number + 1})}">
                            &raquo;
                        </a>
                    </li>

                </ul>
            </div>

        </fieldset>
    </div>

    <!-- Message de succès -->
    <div th:if="${successMessage}"
         th:text="${successMessage}"
         id="successMessage"
         style="display:none;">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script th:inline="javascript">
        document.addEventListener("DOMContentLoaded", function () {

            const input = document.getElementById("searchInput");
            const tableBody = document.getElementById("bailTableBody");
            const loader = document.getElementById("loader");
            const paginationContainer =
                document.getElementById("paginationContainer");

            const contextPath = /*[[@{/}]]*/ "/";
            let timeout = null;
            let currentKeyword = "";
            let requestNumber = 0;

            // Formatage des montants
            function formatMontant(value) {
                const montant = Number(value ?? 0);

                return Number.isFinite(montant)
                    ? montant.toLocaleString("fr-FR")
                    : "";
            }

            document.querySelectorAll(".format-fr").forEach(td => {
                const value = Number(
                    td.textContent.trim().replace(/\s/g, "").replace(",", ".")
                );

                if (Number.isFinite(value)) {
                    td.textContent = formatMontant(value);
                }
            });

            // Messages de succès
            const successDiv = document.getElementById("successMessage");

            if (successDiv && successDiv.textContent.trim() !== "") {
                Swal.fire({
                    icon: "success",
                    title: "Succès !",
                    text: successDiv.textContent.trim(),
                    confirmButtonText: "OK"
                });
            }

            // Échappement HTML des valeurs provenant de l'API
            function escapeHtml(value) {
                return String(value ?? "").replace(/[&<>"']/g, char => ({
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#39;"
                })[char]);
            }

            // Chargement des baux par AJAX
            async function loadData(keyword = "", page = 0) {

                const thisRequest = ++requestNumber;

                currentKeyword = keyword;
                loader.classList.remove("d-none");

                try {
                    const url = new URL(
                        contextPath + "bails/api/search",
                        window.location.origin
                    );

                    url.searchParams.set("keyword", keyword);
                    url.searchParams.set("page", page);

                    const response = await fetch(url, {
                        headers: {
                            "Accept": "application/json"
                        }
                    });

                    if (!response.ok) {
                        throw new Error("Erreur HTTP " + response.status);
                    }

                    const data = await response.json();

                    // Ignorer une réponse ancienne
                    if (thisRequest !== requestNumber) {
                        return;
                    }

                    tableBody.innerHTML = "";

                    if (!data.content || data.content.length === 0) {

                        tableBody.innerHTML = `
                            <tr>
                                <td colspan="5" class="text-center">
                                    Aucun bail trouvé.
                                </td>
                            </tr>`;

                        buildPagination(data);
                        return;
                    }

                    data.content.forEach(b => {

                        const isActif = b.statut === "ACTIF";
                        const statut = escapeHtml(b.statut);

                        const locataire = escapeHtml(b.locataireNom);
                        const appartement =
                            escapeHtml(b.appartementLibelle) + " " +
                            escapeHtml(b.immeubleLibelle) + " " +
                            escapeHtml(b.bailleurPrenom);
							
						const montantl = formatMontant(b.montantLoyer);		
                        const montant = formatMontant(b.total);
                        const id = encodeURIComponent(b.id);

                        let actions = `
                            <span class="text-muted">Aucune action</span>`;

                        if (isActif) {
                            actions = `
                                <div class="dropdown">
                                    <button class="btn btn-light btn-sm"
                                            type="button"
                                            data-bs-toggle="dropdown"
                                            aria-expanded="false"
                                            title="Actions">
                                        <i class="bi bi-three-dots-vertical"></i>
                                    </button>

                                    <ul class="dropdown-menu dropdown-menu-end">

                                        <li>
                                            <a class="dropdown-item"
                                               href="${contextPath}bails/edit/${id}">
                                                <i class="bi bi-pencil me-2"></i>
                                                Modifier
                                            </a>
                                        </li>

                                        <li>
                                            <a class="dropdown-item"
                                               href="${contextPath}bails/${id}/revision-loyer">
                                                <i class="bi bi-graph-up-arrow me-2"></i>
                                                Réviser le loyer
                                            </a>
                                        </li>

                                        <li>
                                            <a class="dropdown-item text-warning resilier-btn"
                                               href="${contextPath}bails/resilier/${id}">
                                                <i class="bi bi-x-circle me-2"></i>
                                                Résilier
                                            </a>
                                        </li>

                                    </ul>
                                </div>`;
                        }

                        const row = document.createElement("tr");

                        if (!isActif) {
                            row.classList.add("table-secondary", "text-muted");
                        }

                        row.innerHTML = `
                            <td>${locataire}</td>
                            <td>${appartement}</td>
							<td>${montantl}</td>
                            <td>${montant}</td>
                            <td>
                                <span class="badge ${
                                    isActif ? "bg-success" : "bg-danger"
                                }">${statut}</span>
                            </td>
                            <td class="text-center">${actions}</td>`;

                        tableBody.appendChild(row);
                    });

                    buildPagination(data);

                } catch (error) {

                    if (thisRequest === requestNumber) {
                        console.error("Erreur AJAX :", error);

                        tableBody.innerHTML = `
                            <tr>
                                <td colspan="5" class="text-center text-danger">
                                    Impossible de charger les baux.
                                    Veuillez réessayer.
                                </td>
                            </tr>`;

                        if (paginationContainer) {
                            paginationContainer.innerHTML = "";
                        }
                    }

                } finally {
                    if (thisRequest === requestNumber) {
                        loader.classList.add("d-none");
                    }
                }
            }

            // Confirmation avant résiliation
            document.addEventListener("click", function (event) {

                const link = event.target.closest(".resilier-btn");

                if (!link) {
                    return;
                }

                event.preventDefault();

                const href = link.href;

                Swal.fire({
                    title: "Confirmation",
                    text: "Voulez-vous vraiment résilier ce bail ?",
                    icon: "warning",
                    showCancelButton: true,
                    confirmButtonText: "Oui, résilier",
                    cancelButtonText: "Annuler",
                    confirmButtonColor: "#dc3545"
                }).then(result => {

                    if (result.isConfirmed) {
                        window.location.href = href;
                    }
                });
            });

            // Pagination AJAX
            function buildPagination(data) {

                if (!paginationContainer) {
                    return;
                }

                paginationContainer.innerHTML = "";

                const totalPages = Number(data.totalPages ?? 0);
                const currentPage = Number(data.number ?? 0);

                if (totalPages <= 1) {
                    return;
                }

                const addPage = (label, page, disabled = false,
                                 active = false, ellipsis = false) => {

                    const li = document.createElement("li");

                    li.className = "page-item";
                    if (disabled) li.classList.add("disabled");
                    if (active) li.classList.add("active");

                    if (ellipsis) {
                        li.innerHTML = `<span class="page-link">${label}</span>`;
                    } else {
                        const a = document.createElement("a");
                        a.className = "page-link";
                        a.href = "#";
                        a.textContent = label;
                        a.dataset.page = page;
                        li.appendChild(a);
                    }

                    paginationContainer.appendChild(li);
                };

                addPage("«", currentPage - 1, currentPage === 0);

                let start = Math.max(0, currentPage - 2);
                let end = Math.min(totalPages - 1, currentPage + 2);

                if (currentPage < 3) {
                    end = Math.min(totalPages - 1, 4);
                }

                if (currentPage > totalPages - 4) {
                    start = Math.max(0, totalPages - 5);
                }

                if (start > 0) {
                    addPage("1", 0);
                    addPage("...", null, true, false, true);
                }

                for (let i = start; i <= end; i++) {
                    addPage(String(i + 1), i, false, i === currentPage);
                }

                if (end < totalPages - 1) {
                    addPage("...", null, true, false, true);
                    addPage(String(totalPages), totalPages - 1);
                }

                addPage("»", currentPage + 1,
                        currentPage >= totalPages - 1);
            }

            // Gestion des clics de pagination
            if (paginationContainer) {
                paginationContainer.addEventListener("click", function (event) {

                    const link = event.target.closest("a[data-page]");

                    if (!link) {
                        return;
                    }

                    event.preventDefault();

                    const page = Number(link.dataset.page);

                    if (Number.isInteger(page) && page >= 0) {
                        loadData(currentKeyword, page);
                    }
                });
            }

            // Recherche avec délai
            input.addEventListener("input", function () {

                clearTimeout(timeout);

                timeout = setTimeout(() => {
                    loadData(input.value.trim(), 0);
                }, 400);
            });

            // Charger la première page
            loadData();
        });
    </script>

</section>
</body>
</html>
