<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<body>
    <!-- Contenu spécifique à cette page -->
    <section layout:fragment="content">
        <div class="container my-2">
            <div class="container mt-4">
                <h2>Gestion des interventions</h2>

				<form th:action="@{/interventions/save}"
				      th:object="${intervention}"
				      method="post"
				      class="needs-validation"
					  id="interventionForm"
				      novalidate>
				
				    <input type="hidden" th:field="*{id}"/>
				
				    <div class="row g-3">
				
				        <!-- Appartement -->
				        <div class="col-md-6">
				            <label class="form-label">
				                Appartement <span class="text-danger">*</span>
				            </label>
				            <select class="form-select"
				                    th:field="*{appartementId}"
				                    required>
				                <option value="">-- Sélectionner --</option>
				                <option th:each="a : ${listeAppartements}"
				                        th:value="${a.id}"
				                        th:text="${a.libelle}">
				                </option>
				            </select>
				        </div>
				
				        <!-- Locataire -->
				        <div class="col-md-6">
				            <label class="form-label">Locataire</label>
				            <select class="form-select"
				                    th:field="*{locataireId}">
				                <option value="">-- Sélectionner --</option>
				                <option th:each="l : ${listeLocataires}"
				                        th:value="${l.id}"
				                        th:text="${l.nom}">
				                </option>
				            </select>
				        </div>
				
				        <!-- Type intervention -->
				        <div class="col-md-6">
				            <label class="form-label">
				                Type d'intervention <span class="text-danger">*</span>
				            </label>
				            <select class="form-select"
				                    th:field="*{typeInterventionId}"
				                    required>
				                <option value="">-- Sélectionner --</option>
				                <option th:each="t : ${listeTypes}"
				                        th:value="${t.id}"
				                        th:text="${t.libelle}">
				                </option>
				            </select>
				        </div>
				
				        <!-- Prestataire -->
				        <div class="col-md-6">
				            <label class="form-label">Prestataire</label>
				            <select class="form-select"
				                    th:field="*{prestataireId}">
				                <option value="">-- Aucun --</option>
				                <option th:each="p : ${listePrestataires}"
				                        th:value="${p.id}"
				                        th:text="${p.nom}">
				                </option>
				            </select>
				        </div>
				
				        <!-- Objet -->
				        <div class="col-12">
				            <label class="form-label">
				                Objet <span class="text-danger">*</span>
				            </label>
				            <input type="text"
				                   class="form-control"
				                   th:field="*{objet}"
				                   maxlength="300"
				                   required>
				        </div>
				
				        <!-- Description -->
				        <div class="col-12">
				            <label class="form-label">Description</label>
				            <textarea class="form-control"
				                      th:field="*{description}"
				                      rows="4"></textarea>
				        </div>
				
				        <!-- Date déclaration -->
				        <div class="col-md-3">
				            <label class="form-label">
				                Déclaration <span class="text-danger">*</span>
				            </label>
				            <input type="date"
				                   class="form-control"
				                   th:field="*{dateDeclaration}"
				                   required>
				        </div>
				
				        <!-- Date prévue -->
				        <div class="col-md-3">
				            <label class="form-label">Date prévue</label>
				            <input type="date"
				                   class="form-control"
				                   th:field="*{datePrevue}">
				        </div>
				
				        <!-- Début -->
				        <div class="col-md-3">
				            <label class="form-label">Début</label>
				            <input type="date"
				                   class="form-control"
				                   th:field="*{dateDebut}">
				        </div>
				
				        <!-- Fin -->
				        <div class="col-md-3">
				            <label class="form-label">Fin</label>
				            <input type="date"
				                   class="form-control"
				                   th:field="*{dateFin}">
				        </div>
				
				        <!-- Statut -->
				        <div class="col-md-4">
				            <label class="form-label">
				                Statut <span class="text-danger">*</span>
				            </label>
				
				            <select class="form-select"
				                    th:field="*{statut}"
				                    required>
				
				                <option value="">-- Sélectionner --</option>
				
				                <option th:each="s : ${T(com.app.enums.StatutIntervention).values()}"
				                        th:value="${s}"
				                        th:text="${s.libelle}">
				                </option>
				
				            </select>
				        </div>
				
				        <!-- Coût estimé -->
				        <div class="col-md-4">
				            <label class="form-label">Coût estimé</label>
				            <input type="number"
				                   class="form-control"
				                   th:field="*{coutEstime}"
				                   min="0"
				                   step="0.01">
				        </div>
				
				        <!-- Coût réel -->
				        <div class="col-md-4">
				            <label class="form-label">Coût réel</label>
				            <input type="number"
				                   class="form-control"
				                   th:field="*{coutReel}"
				                   min="0"
				                   step="0.01">
				        </div>
				
				        <!-- Observation -->
				        <div class="col-12">
				            <label class="form-label">Observation</label>
				            <textarea class="form-control"
				                      th:field="*{observation}"
				                      rows="3"></textarea>
				        </div>
				
				        <!-- Urgente -->
				        <div class="col-12">
				            <div class="form-check form-switch">
				                <input class="form-check-input"
				                       type="checkbox"
				                       th:field="*{urgente}">
				                <label class="form-check-label">
				                    Intervention urgente
				                </label>
				            </div>
				        </div>
				
				    </div>
				
				    <hr>
				
				    <div class="d-flex justify-content-end gap-2">
				
				        <a th:href="@{/interventions}"
				           class="btn btn-secondary">
				            Retour
				        </a>
				
				        <button type="submit"
				                class="btn btn-success">
				            <span th:text="*{id} == null ? 'Enregistrer' : 'Modifier'">Enregistrer</span>
				        </button>
				
				    </div>
				
				</form>
            </div>
        </div>	    
	
	    <!-- Scripts de capitalisation -->
	    <script>
	        function capitalizeWords(input) {
	            input.value = input.value.replace(/\b[\p{L}']+/gu, function(word) {
	                return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
	            });
	        }
	        function uppercaseWords(input){
	            input.value = input.value.replace(/\b[\p{L}']+/gu, function(word) {
	                return word.charAt(0).toUpperCase() + word.slice(1).toUpperCase();
	            });
	        }
	    </script>
		
		<!-- ✅ SweetAlert2 -->
	    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

		<div th:if="${successMessage}" th:text="${successMessage}" id="successMessage" style="display:none;"></div>
	    <!-- ⚠️ Boîte de confirmation avant envoi -->
	    <script>
	        document.getElementById('interventionForm').addEventListener('submit', function (e) {
	            e.preventDefault(); // Bloque l’envoi automatique
	            const form = this;
	            //const isEdit = form.querySelector('input[name="id"]').value !== "";
				const idField = form.querySelector('input[name="id"]');
				const idValue = idField ? idField.value.trim() : "";
				console.log("ID trouvé :", idValue);
	        // ✅ Création si id vide ou null
		        const isEdit = idValue !== null && idValue !== "" && idValue !== "0";
		        console.log("isEdit =", isEdit);

	            Swal.fire({
	                title: isEdit ? 'Confirmation' : 'Confirmation',
	                text: isEdit ? 'Voulez-vous modifier ?' : 'Voulez-vous enregistrer ?',
	                icon: 'question',
	                showCancelButton: true,
	                confirmButtonText: 'Oui',
	                cancelButtonText: 'Non',
	                reverseButtons: true
	            }).then((result) => {
	                if (result.isConfirmed) {
	                    form.submit(); // Si confirmé → on envoie le formulaire
	                }
	            });
			
			// ==== AFFICHAGE DU MESSAGE SUCCÈS APRÈS ACTION ====
			    const successDiv = document.getElementById('successMessage');
			    if (successDiv && successDiv.textContent.trim() !== '') {
			        const msg = successDiv.textContent.trim();
			        Swal.fire({
			            icon: 'success',
			            title: 'Succès !',
			            text: msg,
			            confirmButtonText: 'OK'
			        });
			    }
			});
	    </script>
		
		<script>
		function setupPreview(inputId, previewId) {
		    const input = document.getElementById(inputId);
		    const previewContainer = document.getElementById(previewId);

		    input.addEventListener('change', function (event) {
		        previewContainer.innerHTML = ''; // Vide le contenu précédent
		        const file = event.target.files[0];
		        if (!file) return;

		        // Vérification du type de fichier
		        if (file.type.startsWith('image/')) {
		            const img = document.createElement('img');
		            img.src = URL.createObjectURL(file);
		            img.style.maxWidth = '200px';
		            img.style.borderRadius = '5px';
		            img.style.marginTop = '5px';
		            previewContainer.appendChild(img);
		        } else if (file.type === 'application/pdf') {
		            const pdfLink = document.createElement('a');
		            pdfLink.href = URL.createObjectURL(file);
		            pdfLink.textContent = "📄 Prévisualiser le PDF";
		            pdfLink.target = "_blank";
		            pdfLink.style.display = 'block';
		            pdfLink.style.marginTop = '5px';
		            previewContainer.appendChild(pdfLink);
		        } else {
		            const msg = document.createElement('p');
		            msg.textContent = "⚠️ Format non pris en charge";
		            msg.style.color = 'red';
		            previewContainer.appendChild(msg);
		        }
		    });
		}

		// Initialisation
		document.addEventListener('DOMContentLoaded', function () {
		    setupPreview('carteIdentite', 'previewLive');
		    setupPreview('factureCie', 'previewFacture');
		});
		</script>

		<!-- ==== Scripts utilitaires ==== -->
		<script>
		    function capitalizeWords(input) {
		        input.value = input.value.replace(/\b[\p{L}']+/gu, w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase());
		    }
		    function uppercaseWords(input){
		        input.value = input.value.replace(/\b[\p{L}']+/gu, w => w.charAt(0).toUpperCase() + w.slice(1).toUpperCase());
		    }
		    document.addEventListener("DOMContentLoaded", () => {
		        document.querySelectorAll('.phone_ci').forEach(input => {
		            input.addEventListener('input', (e) => {
		                let v = e.target.value.replace(/\D/g, '').substring(0,10);
		                e.target.value = v.match(/.{1,2}/g)?.join(' ') ?? v;
		            });
		        });
		    });
		</script>
		
	</section>
</body>
</html>
